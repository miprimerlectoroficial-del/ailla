<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ailla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Sora:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width app column. Black + champagne-gold "digital assistant" identity; entry screen is an app-icon hero; bottom tab bar */
:root{
  color-scheme:dark;
  --bg:#09090A; --surface:#141416; --ink:#F6F2E9; --muted:#A8A294;
  --accent:#E6BC6A; --accent-soft:#221C10; --on-accent:#17110A;
  --glow:#F0C879; --glow-soft:#2A2213; --night:#050506; --night-2:#1D1A14; --night-ink:#FBF7EC;
  --warn:#F0B35A; --warn-soft:#2B2212; --ok:#6FD39A; --ok-soft:#10261A; --bad:#F28B7E; --bad-soft:#2C1512;
  --line:#2B2A27;
  --grad:linear-gradient(135deg,#FBE6B0 0%,#E6BC6A 38%,#B98A3C 72%,#E9C98A 100%);
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --fs:16px;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;font-size:var(--fs);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
/* Idoso: same black + gold, but warmer, calmer and with extra contrast and bigger touch targets */
.app[data-mode="idoso"]{--fs:19px;--muted:#CFC8B8;--line:#3A362D;--accent:#F2C976;--night-2:#2A2112;
  --grad:linear-gradient(135deg,#FFF0C6 0%,#F2C976 45%,#D9A74A 100%)}
.app[data-mode="idoso"] .btn{padding:16px 20px}
.app[data-mode="idoso"] .card{border-radius:20px}
/* Kids: colorful icon + playful palette and rounded display font */
.app[data-mode="kids"]{--accent:#B49BFF;--accent-soft:#251D49;--on-accent:#14082E;--glow:#FFD166;--glow-soft:#2E2610;--night-2:#2B1B5C;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --grad:linear-gradient(135deg,#B49BFF 0%,#FF8AC2 55%,#FFC15E 100%)}
.app[data-mode="acessivel"]{--fs:20px;
  --bg:#000;--surface:#000;--ink:#FFF;--muted:#E6E6E6;--accent:#FFE14D;--accent-soft:#1E1E1E;--on-accent:#000;
  --glow:#FFE14D;--glow-soft:#2A2400;--night:#000;--night-2:#000;--night-ink:#FFF;
  --warn:#FFE14D;--warn-soft:#2A2400;--ok:#7CFFA0;--ok-soft:#002A10;--bad:#FF8A80;--bad-soft:#2A0000;--line:#FFF;--grad:#FFE14D;
  background:var(--bg);color:var(--ink);color-scheme:dark}
.app[data-mode="acessivel"] .card,.app[data-mode="acessivel"] .chip{border-width:2px}
body.hc{background:#000}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 6px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:42px;height:42px;flex:none}
.brand b{font-family:var(--display);font-size:1.45em;line-height:1;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.72em}
.proto{font-size:.7em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}

main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 110px}
.screen{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7em} h2{font-size:1.25em} h3{font-size:1.05em}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.label{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* hero: app-splash style entry screen. Gold app icon on black, bold type, soft grid + glow */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:230px;
  background:radial-gradient(90% 70% at 85% 0%, rgba(230,188,106,.22), transparent 60%),radial-gradient(120% 120% at 0% 100%, var(--night-2), var(--night) 65%);
  color:var(--night-ink);border:1px solid rgba(230,188,106,.22);box-shadow:0 18px 50px -24px rgba(230,188,106,.35), inset 0 1px 0 rgba(255,255,255,.06)}
.hero .hero-grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(230,188,106,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(230,188,106,.07) 1px,transparent 1px);
  background-size:26px 26px;-webkit-mask-image:radial-gradient(80% 90% at 90% 0%,#000,transparent 75%);mask-image:radial-gradient(80% 90% at 90% 0%,#000,transparent 75%)}
.hero>*{position:relative}
.hero .hero-head{display:flex;align-items:center;gap:14px;width:100%}
.hero svg.mascot{width:92px;height:92px;flex:none;filter:drop-shadow(0 10px 24px rgba(230,188,106,.35))}
.hero .tag{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:.68em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--glow);
  border:1px solid rgba(230,188,106,.35);background:rgba(230,188,106,.08);border-radius:99px;padding:5px 11px}
.hero .tag i{width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow)}
.hero .slogan{font-family:var(--display);font-weight:800;font-size:1.85em;line-height:1.04;letter-spacing:-.03em}
.hero .slogan em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero p{font-size:.92em;opacity:.82;margin-top:8px;max-width:30ch}
.hero .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--glow);opacity:.7}
.app[data-mode="acessivel"] .hero{border:2px solid #fff;box-shadow:none}
.app[data-mode="acessivel"] .hero .hero-grid{display:none}
/* idoso: calmer hero, no tech grid, bigger icon */
.app[data-mode="idoso"] .hero .hero-grid{display:none}
.app[data-mode="idoso"] .hero .tag,.app[data-mode="acessivel"] .hero .tag{font-size:.56em;letter-spacing:.1em}
.app[data-mode="idoso"] .hero svg.mascot{width:104px;height:104px}
.app[data-mode="idoso"] .hero{background:radial-gradient(120% 120% at 0% 100%, var(--night-2), var(--night) 70%)}
/* kids: confetti glow */
.app[data-mode="kids"] .hero{border-color:rgba(255,138,194,.35);box-shadow:0 18px 50px -24px rgba(180,155,255,.5);
  background:radial-gradient(90% 70% at 90% 0%, rgba(255,138,194,.28), transparent 60%),radial-gradient(120% 120% at 0% 100%, var(--night-2), var(--night) 70%)}
.app[data-mode="kids"] .hero .hero-grid{display:none}
.app[data-mode="kids"] .hero .tag{color:#FFC15E;border-color:rgba(255,193,94,.4);background:rgba(255,193,94,.1)}
.app[data-mode="kids"] .hero .tag i{background:#FFC15E;box-shadow:0 0 8px #FFC15E}
.app[data-mode="kids"] .hero .dot{width:7px;height:7px;opacity:.85}
.app[data-mode="kids"] .hero i.dot:nth-of-type(1){background:#4DE1FF}
.app[data-mode="kids"] .hero i.dot:nth-of-type(2){background:#FF8AC2}
.app[data-mode="kids"] .hero i.dot:nth-of-type(3){background:#7CFFB2}
.app[data-mode="kids"] .hero i.dot:nth-of-type(4){background:#FFC15E}
.app[data-mode="kids"] .hero i.dot:nth-of-type(5){background:#B49BFF}

.greet{display:flex;flex-direction:column;gap:4px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.82em}
.chip span{font-size:.78em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grad);color:var(--on-accent);border-color:transparent;font-weight:700}
.chip[aria-pressed="true"] span{color:var(--on-accent);opacity:.85}
.mode-note{font-size:.88em;color:var(--muted)}

.ask{display:flex;gap:8px}
.ask input,.field{flex:1;min-width:0;font:inherit;padding:14px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ask input::placeholder{color:var(--muted)}
.ask input:focus{border-color:var(--accent)}
.ask .btn{border-radius:99px;padding-inline:22px}
.field{border-radius:16px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;background:var(--grad);color:var(--on-accent);text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.glow{background:var(--grad);color:#17110A}
.btn[disabled]{opacity:.6;cursor:wait}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.examples button{border:1px dashed var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:.82em;color:var(--muted)}
.thinking{display:flex;gap:10px;align-items:center}
.thinking svg{width:46px;height:46px;flex:none}
.note{font-size:.9em;color:var(--muted)}

.pillar{display:flex;flex-direction:column;gap:10px}
.pillar-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pillar-head .verb{font-family:var(--display);font-size:1.15em;font-weight:800;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.task{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.task .ic{width:42px;height:42px;flex:none;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.task .ic svg{width:22px;height:22px}
.task div{min-width:0;flex:1}
.task b{display:block}
.task small{color:var(--muted);font-size:.85em}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:11px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78em;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
body.hc nav.tabs{background:#000;border-top:2px solid #fff}
body.hc nav.tabs button{color:#E6E6E6;font-size:.92em}
body.hc nav.tabs button[aria-current="page"]{color:#FFE14D}

/* guide */
.guide{display:flex;flex-direction:column;gap:16px}
.back{background:none;border:0;padding:0;color:var(--muted);display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.progress i.on{background:var(--grad)}
.stepnum{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.05em}
.instr{font-family:var(--display);font-size:1.5em;line-height:1.2;font-weight:700}
.bubble{display:flex;gap:8px;align-items:flex-start}
.bubble svg{width:48px;height:48px;flex:none}
.bubble .card{flex:1;min-width:0}
.alert{border-radius:16px;padding:14px 16px;background:var(--warn-soft);border-left:5px solid var(--warn)}
.alert b{color:var(--warn)}
.help{background:var(--accent-soft);border-radius:16px;padding:14px 16px}
.adult{background:var(--bad-soft);border-left:5px solid var(--bad);border-radius:16px;padding:14px 16px}
.go{display:flex;flex-direction:column;gap:10px;background:var(--glow-soft);border-radius:18px;padding:14px 16px}
.go .row a{flex:1 1 40%}
.actions{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.pledge{font-size:.82em;color:var(--muted);text-align:center}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done svg.mascot{width:120px;height:120px}
.recap{text-align:left;margin:0;padding-left:1.2em;line-height:1.7}
.source{font-size:.75em;color:var(--muted)}

/* chat */
.chat .me{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--on-accent);border-radius:18px 18px 4px 18px;padding:10px 14px}
.chat .ai{display:flex;gap:8px;align-items:flex-start}
.chat .ai svg{width:44px;height:44px;flex:none}
.chat .ai .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.chat .ai .card{border-radius:4px 18px 18px 18px}
.chat .ai p,.chat .me p{white-space:pre-wrap;overflow-wrap:anywhere}
/* learn */
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-family:var(--display);font-size:1.4em;color:var(--accent)}
details[open].card summary::after{content:"–"}
details.card p{margin-top:8px}
.ex{margin-top:8px;font-size:.9em;color:var(--muted)}

/* scam quiz */
.msg{background:var(--accent-soft);border-radius:18px 18px 18px 4px;padding:14px 16px}
.msg small{display:block;color:var(--muted);margin-bottom:4px}
.verdict{border-radius:16px;padding:14px 16px}
.verdict.ok{background:var(--ok-soft);border-left:5px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:5px solid var(--bad)}
.score{font-variant-numeric:tabular-nums}

/* brand page */
.brandcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;border-radius:24px;padding:24px 18px;
  background:radial-gradient(120% 120% at 50% 30%, var(--night-2), var(--night));color:var(--night-ink)}
.brandcard svg.mascot{width:170px;height:170px}
.brandcard .slogan{font-family:var(--display);font-weight:800;font-size:2em;line-height:1.05}
.brandcard .slogan em{font-style:normal;color:var(--glow)}
.why{display:grid;gap:8px}
.why .card b{display:block;font-family:var(--display);font-size:1.05em;color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:6px}
.lines span{background:var(--glow-soft);border-radius:12px;padding:8px 12px;font-family:var(--display);font-weight:700}

@media (prefers-reduced-motion: no-preference){
  .screen{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
  .tail-glow{animation:pulse 2.8s ease-in-out infinite;transform-origin:60px 60px}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
  .hero .dot{animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
  .bob{animation:bob 3.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
}

/* ---------- abertura (splash) e escolha de modo ---------- */
button.proto{font-family:inherit;color:var(--ink);background:none;cursor:pointer}
main.full{padding-block:12px}
.splash{position:relative;min-height:calc(100dvh - 24px);justify-content:space-between;align-items:center;text-align:center;padding:26px 0 14px;gap:24px}
.splash>*{position:relative}
.splash::before{content:"";position:absolute;inset:-12px -16px;pointer-events:none;
  background:radial-gradient(70% 40% at 50% 34%,rgba(230,188,106,.24),transparent 70%),
  linear-gradient(rgba(230,188,106,.07) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(230,188,106,.07) 1px,transparent 1px) 0 0/28px 28px;
  -webkit-mask-image:radial-gradient(80% 62% at 50% 36%,#000,transparent 82%);mask-image:radial-gradient(80% 62% at 50% 36%,#000,transparent 82%)}
.splash .tag{display:inline-flex;align-items:center;gap:7px;font-size:.68em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--glow);white-space:nowrap;
  border:1px solid rgba(230,188,106,.35);background:rgba(230,188,106,.08);border-radius:99px;padding:5px 11px}
.splash .tag i{width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow)}
.splash-mid{display:flex;flex-direction:column;align-items:center;gap:14px}
.splash svg.mascot{width:168px;height:168px;filter:drop-shadow(0 18px 40px rgba(230,188,106,.4))}
.splash-name{font-family:var(--display);font-weight:800;font-size:2.8em;line-height:1;letter-spacing:-.03em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.splash .slogan{font-family:var(--display);font-weight:600;font-size:1.1em;line-height:1.3;color:var(--muted)}
.splash .slogan em{font-style:normal;color:var(--ink)}
.splash-bot{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.btn.big{width:100%;padding:18px 22px;font-size:1.1em;border-radius:99px}
.pick-list{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.pick:hover,.pick:active{border-color:var(--accent)}
.pick .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--grad);color:#17110A}
.pick .ic svg{width:28px;height:28px}
.pick[data-pick="kids"] .ic{background:linear-gradient(135deg,#B49BFF,#FF8AC2 55%,#FFC15E)}
.pick[data-pick="acessivel"] .ic{background:#FFE14D}
.pick div{flex:1;min-width:0}
.pick b{display:block;font-family:var(--display);font-size:1.15em}
.pick small{color:var(--muted);font-size:.85em}
.pick::after{content:"\203A";font-size:1.8em;color:var(--accent);line-height:1}

/* vagalume ao lado do slogan */
.sl-row{display:flex;align-items:center;gap:10px}
.hero .sl-row{justify-content:space-between;width:100%}
.hero svg.fly{width:86px;height:86px;flex:none;margin-right:-4px}
.splash svg.fly{width:62px;height:62px;flex:none}
.brandcard .sl-row{justify-content:center}
.brandcard svg.fly{width:72px;height:72px;flex:none}
@media (prefers-reduced-motion: no-preference){
  .fly-glow{animation:pulse 2.4s ease-in-out infinite;transform-origin:60px 92px}
}
</style>

<div class="app" id="app" data-mode="geral">
  <header class="top">
    <div class="brand" id="brandmark"></div>
    <button class="proto" type="button" data-act="trocar">Trocar modo</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-tab="aprender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>Aprender</button>
    <button data-tab="proteger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Proteger</button>
    <button data-tab="sobre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M12 13v3"/><circle cx="12" cy="19" r="2.2"/><path d="M9 5.5 7 3M15 5.5 17 3"/></svg>A Ailla</button>
  </div>
</nav>

<script>
/* ---------- Ícone da Ailla: "A" com órbita (substitui o vagalume; mesma função, mesmas chamadas) ---------- */
let _m=0;
function mascot(cls='mascot', mood='happy'){
  const id='m'+(++_m);
  let kids=false;try{kids=state.mode==='kids'&&state.stage==='app'}catch(e){}

  const gold=kids?['#FFFFFF','#FFE27A','#FFB703','#FFF3B0']:['#FFF1C4','#E9C06C','#B98A3C','#F3D595'];
  const orb=kids?['#4DE1FF','#7CFFB2','#FFE27A','#FF8AC2']:gold;
  const spark=kids?'#FF8AC2':'#FFF1C4';
  const ring=mood==='wow'?`<circle class="tail-glow" cx="60" cy="60" r="52" fill="none" stroke="${kids?'#FF8AC2':'#E9C06C'}" stroke-width="1.5" opacity=".7"/>`:'';
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true">
  <defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset=".55" stop-color="${bg[1]}"/><stop offset="1" stop-color="${bg[2]}"/></linearGradient>
    <linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${gold[0]}"/><stop offset=".4" stop-color="${gold[1]}"/><stop offset=".75" stop-color="${gold[2]}"/><stop offset="1" stop-color="${gold[3]}"/></linearGradient>
    <linearGradient id="${id}o" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${orb[0]}"/><stop offset=".4" stop-color="${orb[1]}"/><stop offset=".75" stop-color="${orb[2]}"/><stop offset="1" stop-color="${orb[3]}"/></linearGradient>
    <radialGradient id="${id}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${gold[1]}" stop-opacity=".30"/><stop offset="1" stop-color="${gold[1]}" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="2" y="2" width="116" height="116" rx="30" fill="url(#${id}b)"/>
  <rect x="2.75" y="2.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>
  <circle class="tail-glow" cx="60" cy="62" r="40" fill="url(#${id}g)"/>
  ${ring}
  <path d="M32 94 L60 22 L88 94" fill="none" stroke="url(#${id}a)" stroke-width="9.5" stroke-linejoin="miter" stroke-miterlimit="1.6" stroke-linecap="butt"/>
  <g transform="rotate(-24 60 68)"><ellipse cx="60" cy="68" rx="47" ry="14" fill="none" stroke="url(#${id}o)" stroke-width="4.6" stroke-linecap="round" stroke-dasharray="196 100" stroke-dashoffset="-14"/></g>
  <circle cx="99" cy="50" r="3.4" fill="${spark}"/>
</svg>`;
}

  </g></svg>`;

const state={mode:'geral',tab:'inicio',guide:null,step:0,help:false,quiz:0,acertos:0,resp:null,askMsg:'',thinking:false,onde:'',stage:'splash'};
/* IA da Ailla: chama a função do próprio site (/api/ailla), que conversa com o Gemini sem expor a chave */
async function chamarAilla(body,signal){
  let r;
  try{r=await fetch('/api/ailla',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({modo:state.mode},body)),signal});}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'}}
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok)throw {code:d.code||'error'};
  return d;
}
let sampleFn=async(messages,opts={})=>{
  const d=await chamarAilla({tipo:'chat',mensagens:messages.slice(1)},opts.signal);
  const text=String(d.text||'');if(opts.onText&&text)opts.onText({text});return {text};
};
sampleFn.json=async(q)=>{const d=await chamarAilla({tipo:'guia',pedido:String(q).slice(0,300)});return d.json||null};

const LUGARES=['shopping','farmácia','farmacia','hospital','mercado','supermercado','padaria','banco','agência','posto','ubs','posto de saúde','restaurante','escola','parque','cinema','correios','prefeitura','poupatempo','academia','pet shop','lotérica','loterica','delegacia','igreja','praia','rodoviária','aeroporto','estação','metrô','metro','biblioteca','museu','feira'];
function detectarLugar(q){
  const m=q.match(/(?:ir\s+(?:ao|à|a|até\s+o|até\s+a|até|para\s+o|para\s+a|pro|pra|no|na)|chegar\s+(?:ao|à|no|na|até)|onde\s+fica\s+(?:o|a)?|perto\s+de\s+mim\s+(?:um|uma)?|achar\s+(?:um|uma)?|procurar\s+(?:um|uma)?)\s+([^?.!,]{2,40})/i);
  if(m)return m[1].trim().replace(/\s+(mais\s+)?(perto|próximo|proximo).*$/i,'').trim();
  const l=LUGARES.find(w=>q.includes(w));
  return l||'';
}
const enc=encodeURIComponent;

  const alvo=state.onde?`${lugar} perto de ${state.onde}`:`${lugar} perto de mim`;

const OK_DOM=['gov.br','google.com','whatsapp.com','bcb.gov.br','caixa.gov.br','correios.com.br','uber.com','99app.com','moovitapp.com','apple.com','android.com','support.google.com'];
function linkSeguro(l){
  try{const u=new URL(l.url);if(u.protocol==='https:'&&OK_DOM.some(d=>u.hostname===d||u.hostname.endsWith('.'+d)))return {rotulo:l.rotulo,url:u.href};}catch(e){}
  return {rotulo:l.rotulo,url:'https://www.google.com/search?q='+enc(l.rotulo||'')};
}

const PUBLICO={kids:'uma criança de 7 a 12 anos. Use frases curtas e alegres. Se o pedido envolver dinheiro, compras, encontros, sair sozinha ou temas de adulto, o primeiro passo deve ser chamar um adulto responsável.',
 geral:'um adulto que quer mais autonomia no dia a dia. Seja direto.',

 acessivel:'uma pessoa com deficiência (visual, auditiva ou motora). Inclua dicas de acessibilidade quando fizer sentido, como leitor de tela, ditado por voz, legendas ou atalhos.'};
function promptIA(q){
  return `Você é a Ailla, uma vagalume que guia pessoas no mundo digital. Lema: "Ailla ilumina, você caminha." Você NUNCA faz a tarefa pela pessoa: só explica o passo a passo para ela mesma fazer no celular dela.
Público: ${PUBLICO[state.mode]}
Pedido da pessoa: "${q.slice(0,300)}"

Responda SOMENTE com um JSON neste formato:
{"titulo":"nome curto da tarefa","passos":[{"t":"instrução curta","ajuda":"explicação extra simples","alerta":"aviso de segurança ou string vazia"}],"lugar":"tipo de lugar físico se o pedido é ir a algum lugar (ex.: shopping, farmácia), senão string vazia","links":[{"rotulo":"texto do botão","url":"https://..."}]}
Regras: português do Brasil; de 3 a 6 passos; cada "t" com no máximo 14 palavras; use "alerta" só em passos sensíveis (dinheiro, dados, senhas, desconhecidos, sair de casa). Nunca invente endereços, nomes de estabelecimentos ou telefones. Em "links", use no máximo 2 sites oficiais que você tenha certeza que existem (ex.: gov.br), ou deixe vazio. Se o pedido for perigoso ou ilegal, devolva passos que orientem a pessoa a buscar ajuda segura.`;
}
async function gerarGuia(q,lugar){
  if(!sampleFn){if(lugar){abrir(guiaLugar(lugar));}return}
  state.thinking=true;render();
  try{
    const r=await sampleFn.json(q);
    state.thinking=false;
    if(!r||!Array.isArray(r.passos)||!r.passos.length)throw {code:'invalid_json'};
    abrir({titulo:String(r.titulo||'Seu passo a passo'),fonte:'ia',lugar:String(r.lugar||lugar||'').trim(),
      links:(Array.isArray(r.links)?r.links:[]).slice(0,2).filter(l=>l&&l.url).map(linkSeguro),
      passos:r.passos.slice(0,6).map(p=>({t:String(p.t||''),h:String(p.ajuda||'Faça com calma. Se travar, volte um passo.'),alerta:p.alerta?String(p.alerta):''})).filter(p=>p.t)});
  }catch(e){state.thinking=false;if(lugar){abrir(guiaLugar(lugar));return}render()}
}

Seu papel é GUIAR, nunca executar: você não faz nada pela pessoa, não acessa o celular dela e não realiza pagamentos. Você explica para ela mesma fazer.
Público deste modo: ${PUBLICO[state.mode]}
Como responder:
- Português do Brasil, tom acolhedor e sem julgamento, sem termos técnicos.

- Quando for uma tarefa, dê de 3 a 5 passos numerados (1., 2., 3.), cada um numa linha, e termine perguntando se a pessoa conseguiu ou travou em algum passo.
- Antes de passos com dinheiro, senha, dados pessoais ou desconhecidos, escreva uma linha começando com "Atenção:".
- Nunca invente endereços, nomes de lojas, telefones ou links.
- Se a mensagem disser que o app vai mostrar botões de mapa, diga que os botões estão logo abaixo da sua resposta.
- Se a pessoa fizer uma pergunta ou pesquisa de conhecimento (história, pessoas, ciência, geografia, curiosidades, significado de palavras, qualquer assunto), responda direto com a informação, em linguagem simples e sem passos numerados. Responder perguntas não é fazer a tarefa por ela: é iluminar o caminho. Se fizer sentido, termine sugerindo onde a pessoa pode aprender mais sozinha.
- Se o pedido for perigoso, ilegal ou fora do seu papel, recuse com gentileza e indique um caminho seguro, como um adulto de confiança, um familiar ou um canal oficial.`;
}
function anexos(q){
  const ql=q.toLowerCase();
  const lugar=detectarLugar(ql);
  const task=M().tarefas.find(t=>t.kw.some(k=>ql.includes(k)));
  return {lugar,task:task?task.id:'',q};
}

/* ---------- Pesquisa para todos, sem IA (Wikipédia) ---------- */
function termoBusca(q){
  let t=q.replace(/[?!.]+\s*$/,'').trim();
  t=t.replace(/^(ailla[,!\s]+)?(oi[,!\s]+|olá[,!\s]+)?/i,'');
  t=t.replace(/^(eu\s+)?(quero|queria|gostaria\s+de|preciso)\s+(pesquisar|saber|procurar|buscar|entender|aprender)(\s+(sobre|quem|o\s+que))?\s*/i,m=>/quem|o\s+que/i.test(m)?m.match(/quem|o\s+que/i)[0]+' ':'');
  t=t.replace(/^(pesquis(e|ar|a)|busc(a|ar)|procur(a|ar)|me\s+(fala|diga|explica|conta))\s+(sobre\s+)?/i,'');
  t=t.replace(/^(quem\s+(foi|é|era|são|foram)|o\s+que\s+(é|foi|são|significa|quer\s+dizer)|o\s+que|qual\s+(é|foi|era)|quando\s+(foi|aconteceu|começou)|onde\s+(fica|é)|como\s+funciona|por\s*que|pra\s+que\s+serve)\s+/i,'');
  t=t.replace(/^(o|a|os|as|um|uma)\s+/i,'').trim();
  return t||q;
}
async function wiki(q){
  const t=termoBusca(q);
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const s=await fetch('https://pt.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch='+enc(t),{signal:ctl.signal}).then(r=>r.json());
    const hit=s&&s.query&&s.query.search&&s.query.search[0];if(!hit)return null;
    const p=await fetch('https://pt.wikipedia.org/api/rest_v1/page/summary/'+enc(hit.title.replace(/ /g,'_')),{signal:ctl.signal}).then(r=>r.json());
    if(!p||!p.extract||p.type==='disambiguation')return null;
    let txt=p.extract.trim();
    if(txt.length>650){const c=txt.slice(0,650);const fim=c.lastIndexOf('. ');txt=(fim>200?c.slice(0,fim+1):c+'…')}
    return {titulo:p.title||hit.title,texto:txt,url:(p.content_urls&&p.content_urls.mobile&&p.content_urls.mobile.page)||('https://pt.m.wikipedia.org/wiki/'+enc(hit.title.replace(/ /g,'_')))};
  }catch(e){return null}finally{clearTimeout(tm)}
}
async function wikiMais(titulo){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch('https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=plain&exchars=2200&format=json&origin=*&titles='+enc(titulo),{signal:ctl.signal}).then(r=>r.json());
    const pg=r&&r.query&&r.query.pages?Object.values(r.query.pages)[0]:null;
    const t=pg&&pg.extract?pg.extract.replace(/\n{2,}/g,'\n\n').trim():'';
    return t||null;
  }catch(e){return null}finally{clearTimeout(tm)}
}
async function semIA(q,x,resp){
  if(x.lugar){resp.text=`Vamos chegar ao lugar que você quer! Os botões do mapa estão logo abaixo. Toque em "Ver no mapa", escolha o mais perto e depois toque em "Rotas".`;return}
  if(x.task){resp.text='Tenho um guia pronto para isso. Toque no cartão abaixo e eu acendo a luz em cada passo.';return}
  const w=await wiki(q);
  resp.web={q,url:w?w.url:'',titulo:w?w.titulo:''};
  resp.text=w?w.texto:'Não achei uma resposta para isso. Tente escrever só o nome do assunto, por exemplo: "fotossíntese" ou "Pedro Álvares Cabral".';
}

async function enviar(q){
  q=q.trim();if(!q||chat.busy)return;
  chat.open=true;state.guide=null;
  const x=anexos(q);
  chat.msgs.push({role:'user',text:q});
  const resp={role:'assistant',text:'',x,pending:true};
  chat.msgs.push(resp);
  render();rolarFim();
  if(!sampleFn){
    chat.busy=true;
    await semIA(q,x,resp);
    resp.pending=false;chat.busy=false;render();rolarFim();
    if(state.mode==='acessivel'&&resp.text)falar(resp.text);
    return;
  }
  chat.busy=true;chat.ctl=new AbortController();render();
  const hist=chat.msgs.filter(m=>!m.pending&&m.text).slice(-12).map(m=>({role:m.role,content:m.text}));
  const ultimo=hist[hist.length-1];
  if(ultimo&&x.lugar)ultimo.content+=`\n[O app vai mostrar botões do Google Maps para: ${x.lugar}]`;
  try{
    const r=await sampleFn([{role:'user',content:regras()},...hist],{cache:false,modelTier:'quick',signal:chat.ctl.signal,
      onText:({text})=>{resp.text=text;resp.pending=false;const el=document.getElementById('ultima');if(el){el.textContent=text}else render();rolarFim()}});
    resp.text=r.text;
  }catch(e){
    resp.text=e&&e.text?e.text:'';
    if(e&&e.code==='not_granted'){sampleFn=null;await semIA(q,x,resp)}
    else if(e&&e.code==='rate_limited')resp.text+=(resp.text?'\n\n':'')+'Muitas mensagens seguidas. Espere um pouquinho e mande de novo.';
    else if(e&&e.code==='refused')resp.text='Esse assunto eu não consigo guiar. Que tal pedir ajuda a alguém de confiança?';
    else if(!(e&&e.code==='cancelled')){resp.text='';await semIA(q,x,resp);if(!resp.web||!resp.web.titulo)resp.text='A luz piscou e a conexão caiu. Mande a mensagem de novo.'}
  }
  resp.pending=false;chat.busy=false;chat.ctl=null;render();rolarFim();
  if(state.mode==='acessivel'&&resp.text)falar(resp.text);
}

  else if(state.tab==='proteger')v.innerHTML=viewProteger();
  else if(state.tab==='sobre')v.innerHTML=viewSobre();
  else v.innerHTML=viewInicio();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',!state.guide&&!chat.open&&b.dataset.tab===state.tab?'page':'false'));
  if(state.guide&&state.mode==='acessivel'){const i=$('#instr');if(i)falar(i.textContent)}
}

function abrir(g){state.guide=g;state.thinking=false;state.step=0;state.help=false;state.askMsg='';state.onde='';render();scrollTo(0,0)}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pick){escolher(b.dataset.pick);return}
  if(b.dataset.mais){const m=chat.msgs[+b.dataset.mais];if(!m||!m.web||m.web.carregando)return;m.web.carregando=true;render();
    wikiMais(m.web.titulo).then(t=>{m.web.carregando=false;if(t&&t.length>m.text.length){m.text=t;m.web.expandido=true}else{m.web.semMais=true;m.web.expandido=true}render()});return}
  if(b.dataset.mode){setMode(b.dataset.mode);return}
  if(b.dataset.task){const t=M().tarefas.find(x=>x.id===b.dataset.task);if(t)abrir(t);return}
  if(b.dataset.ex){enviar(b.dataset.ex);return}
  if(b.dataset.guia){const m=chat.msgs[+b.dataset.guia];if(m&&m.x)gerarGuia(m.x.q,m.x.lugar);return}
  if(b.dataset.tab){state.tab=b.dataset.tab;state.guide=null;chat.open=false;calar();render();scrollTo(0,0);return}
  const a=b.dataset.act;if(!a)return;const g=state.guide;
  if(a==='entrar'){state.stage='modes';render();scrollTo(0,0)}
  else if(a==='trocar'){calar();if(chat.ctl)chat.ctl.abort();chat.open=false;state.guide=null;state.stage='modes';render();scrollTo(0,0)}
  else if(a==='prox'){state.step++;state.help=false;render();scrollTo(0,0)}
  else if(a==='ant'){state.step=Math.max(0,state.step-1);state.help=false;render()}
  else if(a==='ajuda'){state.help=!state.help;render();if(state.help&&state.mode==='acessivel')falar(g.passos[state.step].h)}
  else if(a==='ouvir'){const p=g.passos[state.step];falar(p.t+(p.alerta?' Atenção: '+p.alerta:''))}
  else if(a==='refazer'){abrir(g)}
  else if(a==='sair'){state.guide=null;calar();render();if(chat.open)rolarFim()}
  else if(a==='fecharchat'){chat.open=false;calar();render();scrollTo(0,0)}
  else if(a==='parar'){chat.ctl&&chat.ctl.abort()}
  else if(a==='limpar'){if(chat.ctl)chat.ctl.abort();chat.msgs=[];render()}
  else if(a==='r-golpe'||a==='r-ok'){state.resp=(a==='r-golpe');if(state.resp===M().quiz[state.quiz].golpe)state.acertos++;render()}
  else if(a==='q-prox'){state.quiz++;state.resp=null;render()}
  else if(a==='quiz-reset'){state.quiz=0;state.acertos=0;state.resp=null;render()}
});
document.addEventListener('input',e=>{
  if(e.target.id!=='onde'||!state.guide)return;
  state.onde=e.target.value.trim();
  const links=mapLinks(state.guide.lugar);
  document.querySelectorAll('.go a.btn').forEach((a,i)=>{if(links[i])a.href=links[i].url});
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='ask'&&e.target.id!=='chatform')return;e.preventDefault();
  const i=e.target.querySelector('input');const q=i.value.trim();if(!q)return;i.value='';enviar(q);
});

render();
</script>

</body></html>
